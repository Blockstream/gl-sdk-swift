name: Publish

# Publishes the Swift package for each gl-sdk release of
# Blockstream/greenlight. greenlight builds the XCFramework and the Swift
# bindings and attaches them to its gl-sdk-vX.Y.Z release. This workflow
# commits the bindings and a Package.swift pointing at that zip to main,
# tags X.Y.Z and creates the X.Y.Z release here. It only writes to this
# repository and only reads public greenlight releases, so it runs with
# the default GITHUB_TOKEN.
#
# GitHub disables scheduled workflows in public repositories after 60
# days without activity. Re-enable it on the Actions tab, or run it by
# hand, which works either way.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.5.1 (default: every gl-sdk release not yet published here)'
        required: false
        type: string
      dry_run:
        description: 'Prepare the commit and tag, but do not push or release'
        required: false
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  GL_REPO: Blockstream/greenlight
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find the versions to publish
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSIONS="${{ inputs.version }}"
          else
            VERSIONS=$(gh release list -R "$GL_REPO" --limit 100 --json tagName --jq '.[].tagName' \
              | sed -n 's/^gl-sdk-v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | sort -V)
          fi
          TODO=""
          for V in $VERSIONS; do
            if git rev-parse -q --verify "refs/tags/$V" >/dev/null; then
              continue  # already published
            fi
            ASSETS=$(gh release view "gl-sdk-v$V" -R "$GL_REPO" --json assets --jq '[.assets[].name] | join(" ")')
            case " $ASSETS " in
              *" glsdkFFI.xcframework.zip "*" glsdk.swift "*|*" glsdk.swift "*" glsdkFFI.xcframework.zip "*)
                TODO="$TODO $V" ;;
              *)
                # Releases from before greenlight built the Swift assets,
                # or whose build has not finished yet.
                if [ -n "${{ inputs.version }}" ]; then
                  echo "::error::gl-sdk-v$V in $GL_REPO has no Swift assets"
                  exit 1
                fi
                echo "gl-sdk-v$V has no Swift assets (yet), skipping" ;;
            esac
          done
          echo "Publishing:${TODO:- nothing}"
          echo "TODO=$TODO" >> "$GITHUB_ENV"

      - name: Publish
        if: env.TODO != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for V in $TODO; do
            DIR="$RUNNER_TEMP/$V"
            gh release download "gl-sdk-v$V" -R "$GL_REPO" --dir "$DIR" \
              --pattern glsdkFFI.xcframework.zip --pattern glsdk.swift \
              --pattern glsdkFFI.xcframework.zip.checksum
            scripts/prepare.sh "$V" "$DIR" \
              "https://github.com/$GL_REPO/releases/download/gl-sdk-v$V/glsdkFFI.xcframework.zip"

            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "::notice::Dry run, not pushing $V"
              continue
            fi
            git push --atomic origin HEAD:refs/heads/main "refs/tags/$V"
            gh release create "$V" --verify-tag --title "$V" \
              --notes "Greenlight SDK $V, built from [gl-sdk-v$V](https://github.com/$GL_REPO/releases/tag/gl-sdk-v$V). See the [changelog](https://github.com/$GL_REPO/blob/gl-sdk-v$V/libs/gl-sdk/CHANGELOG.md)."
          done

      - name: Verify
        if: env.TODO != '' && inputs.dry_run != true
        run: for V in $TODO; do scripts/verify.sh "$V"; done
